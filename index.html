<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Moon Club</title>
<meta name="description" content="Tu constancia en Moon Wellness Club: visitas, rutinas, premios, horario y membresías.">
<meta property="og:title" content="Moon Club"><meta property="og:description" content="Entrena, junta destellos y cámbialos por premios en Moon Wellness Club."><meta property="og:image" content="https://moon-club.vercel.app/img/logo-full.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Cormorant+Garamond:ital,wght@1,400;1,500&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&family=Cormorant+Garamond:ital,wght@1,500&display=swap" rel="stylesheet"></noscript>
<style>
:root{
  --bg:#050505;--bg2:#0d0d0e;--card:#141416;--card2:#1b1b1e;
  --bone:#f2ede4;--bone2:#cfc9bc;--mu:#8b8880;--gold:#c9a96b;--gold2:#e6cc94;
  --line:rgba(242,237,228,.1);--line2:rgba(242,237,228,.2);
  --ok:#9dbfa6;--bad:#d58a80;
  --sans:"Montserrat","Helvetica Neue",Arial,sans-serif;--serif:"Cormorant Garamond",Georgia,serif;
  --out:cubic-bezier(.23,1,.32,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--bone);font-family:var(--sans);-webkit-text-size-adjust:100%}
body{min-height:100dvh;font-size:15px;line-height:1.45;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input,select{font:inherit;color:var(--bone)}
h1,h2,h3,p{margin:0}
.app{max-width:480px;margin:0 auto;min-height:100dvh;position:relative;padding-bottom:calc(86px + env(safe-area-inset-bottom))}
.admin .app,.app.wide{max-width:980px}
.top{position:relative;z-index:6;display:flex;align-items:center;justify-content:space-between;padding:calc(18px + env(safe-area-inset-top)) 22px 6px}
.brand{display:flex;flex-direction:column;align-items:flex-start;gap:3px}
.phases{display:flex;gap:3px;align-items:center}
.phases i{display:block;width:11px;height:11px}
.brand b{font-weight:500;letter-spacing:.42em;font-size:12px;padding-left:2px}
.coins{display:flex;align-items:center;gap:8px;padding:8px 14px;border:1px solid var(--line2);border-radius:99px;font-weight:600;font-size:14px;background:rgba(255,255,255,.03)}
.coins svg{width:15px;height:15px;color:var(--gold2)}
.sec{padding:0 22px}
.eyebrow{font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--mu);font-weight:500}
.serif{font-family:var(--serif);font-style:italic;font-weight:500}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px}
.row{display:flex;align-items:center;gap:12px}
.sp{justify-content:space-between}
.mu{color:var(--mu)}
.gold{color:var(--gold2)}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;height:54px;padding:0 26px;border-radius:99px;background:var(--bone);color:#0a0a0a;font-weight:600;font-size:14px;letter-spacing:.06em;transition:transform .16s var(--out),opacity .2s}
.btn:active{transform:scale(.97)}
.btn.gold{background:linear-gradient(135deg,#e9d3a0,#c9a96b);box-shadow:0 8px 30px rgba(201,169,107,.25)}
.btn.ghost{background:transparent;color:var(--bone);border:1px solid var(--line2)}
.btn.sm{height:44px;padding:0 16px;font-size:12px}
.btn[disabled]{opacity:.35;pointer-events:none}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:99px;border:1px solid var(--line2);font-size:11px;letter-spacing:.08em;color:var(--bone2)}
.pill.ok{color:var(--ok);border-color:rgba(157,191,166,.35)}
.pill.warn{color:var(--gold2);border-color:rgba(201,169,107,.4)}
/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(to top,#050505 60%,transparent);z-index:20}
.nav>div{display:flex;gap:4px;width:100%;max-width:452px;padding:6px;border:1px solid var(--line);border-radius:99px;background:rgba(20,20,22,.88);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.nav button{flex:1;height:48px;border-radius:99px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--mu);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:500;transition:background .25s,color .25s}
.nav button svg{width:19px;height:19px}
.nav button.on{background:var(--bone);color:#0a0a0a}
/* hero */
.hero{position:relative;text-align:center;padding:6px 22px 0}
.stage-name{margin-top:2px}
.stage-name h1{font-family:var(--serif);font-style:italic;font-weight:500;font-size:34px;letter-spacing:.01em}
.luna{width:min(78vw,300px);margin:6px auto 0;display:block;overflow:visible}
.float{animation:float 5.5s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
.blink{animation:blink 5s infinite;transform-origin:center;transform-box:fill-box}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96.5%{transform:scaleY(.08)}}
.halo{animation:halo 4s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
@keyframes halo{0%,100%{opacity:.85;transform:scale(1)}50%{opacity:1;transform:scale(1.05)}}
.orbit{animation:spin 24s linear infinite;transform-origin:150px 150px}
@keyframes spin{to{transform:rotate(360deg)}}
.tw{animation:tw 3s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
.bump{animation:bump .7s var(--out)}
@keyframes bump{0%{transform:scale(1)}30%{transform:scale(1.09) translateY(-8px)}100%{transform:scale(1)}}
.plus{position:absolute;left:50%;top:38%;font-weight:700;font-size:34px;color:var(--gold2);pointer-events:none;animation:plus 1.5s var(--out) forwards;text-shadow:0 4px 30px rgba(201,169,107,.6)}
@keyframes plus{0%{opacity:0;transform:translate(-50%,10px)}20%{opacity:1}100%{opacity:0;transform:translate(-50%,-90px)}}
.sparks{position:absolute;inset:0;pointer-events:none}
.sparks i{position:absolute;left:50%;top:44%;width:6px;height:6px;border-radius:50%;background:var(--gold2);opacity:0;animation:spark 1.2s var(--out) forwards}
@keyframes spark{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--x),var(--y)) scale(.2)}}
/* progress */
.bar{height:8px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#9c8147,#e6cc94);transition:width .9s var(--out)}
.week{display:flex;gap:8px}
.week span{flex:1;height:44px;border-radius:14px;border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;color:var(--mu);font-size:11px;letter-spacing:.1em}
.week span.on{background:var(--bone);color:#0a0a0a;border-color:var(--bone)}
.week span svg{width:18px;height:18px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat b{display:block;font-size:30px;font-weight:300;letter-spacing:-.01em}
.stat span{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--mu)}
.missions{display:flex;flex-direction:column;gap:10px}
.mission{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:18px;border:1px solid var(--line);background:var(--card)}
.mission .ic{width:40px;height:40px;border-radius:50%;border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;flex:none}
.mission .ic svg{width:19px;height:19px}
.mission.done .ic{background:var(--gold);border-color:var(--gold);color:#0a0a0a}
.mission small{display:block;color:var(--mu);font-size:12px}
.mission .rw{margin-left:auto;font-weight:600;font-size:13px;color:var(--gold2);white-space:nowrap}
/* rewards */
.rwd{display:flex;gap:14px;align-items:center;padding:16px;border-radius:20px;border:1px solid var(--line);background:var(--card);margin-bottom:10px}
.rwd .ic{width:54px;height:54px;border-radius:16px;background:var(--card2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;flex:none;color:var(--gold2)}
.rwd .ic svg{width:24px;height:24px}
.rwd h3{font-size:15px;font-weight:600}
.rwd p{font-size:12.5px;color:var(--mu)}
.rwd .go{margin-left:auto;text-align:right;flex:none}
.rwd .go b{display:block;font-size:15px;margin-bottom:6px;color:var(--gold2)}
.ledger li{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);font-size:13.5px;list-style:none}
.ledger{margin:0;padding:0}
.ledger li:last-child{border:0}
.pos{color:var(--gold2);font-weight:600}.neg{color:var(--mu);font-weight:600}
/* modal */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:fade .25s}
@keyframes fade{from{opacity:0}}
.sheet{width:100%;max-width:480px;background:var(--bg2);border:1px solid var(--line2);border-bottom:0;border-radius:28px 28px 0 0;padding:26px 24px calc(28px + env(safe-area-inset-bottom));animation:up .4s var(--out);max-height:92dvh;overflow:auto}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet h2{font-family:var(--serif);font-style:italic;font-weight:500;font-size:30px;margin-bottom:6px}
.codebox{display:flex;gap:10px;justify-content:center;margin:22px 0}
.codebox input{width:100%;max-width:230px;height:66px;text-align:center;font-size:32px;letter-spacing:.5em;padding-left:.5em;background:var(--card);border:1px solid var(--line2);border-radius:18px;outline:none}
.codebox input:focus{border-color:var(--gold)}
.err{color:var(--bad);font-size:13px;text-align:center;min-height:20px}
video{width:100%;border-radius:20px;background:#000;aspect-ratio:1;object-fit:cover}
.big-code{font-size:40px;letter-spacing:.3em;text-align:center;font-weight:300;margin:14px 0 4px;padding-left:.3em}
/* forms */
.field{display:block;margin-bottom:14px}
.field span{display:block;font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--mu);margin-bottom:7px}
.field input,.field select{width:100%;height:52px;padding:0 16px;background:var(--card);border:1px solid var(--line2);border-radius:16px;outline:none}
.field input:focus{border-color:var(--gold)}
.plans{display:grid;gap:8px}
.plans label{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border:1px solid var(--line2);border-radius:16px;cursor:pointer}
.plans input{display:none}
.plans label:has(input:checked){background:var(--bone);color:#0a0a0a;border-color:var(--bone)}
.plans small{opacity:.65}
/* welcome */
.welcome{min-height:100dvh;display:flex;flex-direction:column;justify-content:center;padding:30px 26px;text-align:center}
.welcome .big{font-family:var(--serif);font-style:italic;font-size:44px;line-height:1.05;margin:18px 0 10px}
.welcome .phases i{width:22px;height:22px}
.welcome .phases{justify-content:center;gap:6px}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--bone);color:#0a0a0a;padding:12px 20px;border-radius:99px;font-weight:600;font-size:13px;z-index:60;animation:up .4s var(--out);white-space:nowrap}
/* admin */
.atabs{display:flex;gap:6px;padding:8px 22px 0;overflow:auto}
.atabs button{padding:10px 18px;border-radius:99px;border:1px solid var(--line2);color:var(--bone2);font-size:12px;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap}
.atabs button.on{background:var(--bone);color:#0a0a0a;border-color:var(--bone)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--mu);font-weight:500;padding:10px 8px;border-bottom:1px solid var(--line2)}
td{padding:13px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
td input{width:90px;height:36px;padding:0 10px;background:var(--card2);border:1px solid var(--line2);border-radius:10px;outline:none}
.scroll{overflow:auto}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.qrwrap{background:#fff;padding:14px;border-radius:20px;width:max-content;margin:14px auto}
.qrwrap svg,.qrwrap img{display:block;width:210px;height:210px}
.space{height:18px}.space2{height:28px}
.logo{display:block;height:46px;width:auto}
.logo.big{height:auto;width:min(62vw,250px);margin:0 auto}
.photo{position:relative;overflow:hidden}
.photo>img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 40%;opacity:.55;filter:grayscale(.35) contrast(1.05)}
.photo::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(5,5,5,.55) 0%,rgba(5,5,5,.25) 38%,rgba(5,5,5,.88) 82%,#050505 100%)}
.photo>*:not(img.bg){position:relative;z-index:2}
.chips{display:flex;gap:8px;overflow:auto;padding:2px 22px 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:12px 16px;border-radius:99px;border:1px solid var(--line2);font-size:12px;letter-spacing:.08em;color:var(--bone2)}
.chip.on{background:var(--bone);color:#0a0a0a;border-color:var(--bone);font-weight:600}
.search{display:block;margin:0 22px 12px}
.search input{width:100%;height:50px;padding:0 18px;border-radius:99px;background:var(--card);border:1px solid var(--line2);outline:none;font-size:14px}
.search input:focus{border-color:var(--gold)}
.exrow{display:flex;gap:14px;align-items:center;padding:10px;border-radius:20px;border:1px solid var(--line);background:var(--card);margin:0 22px 10px;text-align:left;width:calc(100% - 44px)}
.exrow .th{width:68px;height:68px;border-radius:14px;background:#e8e4da;overflow:hidden;flex:none}
.exrow .th img{width:100%;height:100%;object-fit:cover}
.exrow h3{font-size:14.5px;font-weight:600;line-height:1.25}
.exrow p{font-size:12px;color:var(--mu);margin-top:3px}
.exrow .add{margin-left:auto;width:38px;height:38px;border-radius:50%;border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}
.exhero{position:relative;border-radius:22px;overflow:hidden;background:#e8e4da;aspect-ratio:1/.78}
.exhero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:xf 1.8s steps(1) infinite}
.exhero img:nth-child(2){animation-delay:.9s;opacity:0;animation-name:xf2}
@keyframes xf{0%{opacity:1}50%{opacity:0}}
@keyframes xf2{0%{opacity:0}50%{opacity:1}}
.steps{list-style:none;padding:0;margin:0;counter-reset:s}
.steps li{counter-increment:s;display:flex;gap:14px;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px}
.steps li::before{content:counter(s);flex:none;width:26px;height:26px;border-radius:50%;border:1px solid var(--gold);color:var(--gold2);font-size:12px;display:flex;align-items:center;justify-content:center;margin-top:1px}
.tag{display:inline-block;padding:5px 12px;border-radius:99px;background:rgba(201,169,107,.12);color:var(--gold2);font-size:11.5px;letter-spacing:.06em;margin:0 6px 6px 0}
.routine{padding:18px;border-radius:22px;border:1px solid var(--line);background:var(--card);margin-bottom:12px}
.routine h3{font-family:var(--serif);font-style:italic;font-weight:500;font-size:26px}
.thumbs{display:flex;margin:12px 0 14px}
.thumbs span{width:38px;height:38px;border-radius:50%;overflow:hidden;border:2px solid var(--card);margin-left:-8px;background:#e8e4da}
.thumbs span:first-child{margin-left:0}
.thumbs img{width:100%;height:100%;object-fit:cover}
.work{position:fixed;inset:0;z-index:50;background:var(--bg);overflow:auto;padding-bottom:140px;animation:fade .25s}
.work .bar2{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:calc(14px + env(safe-area-inset-top)) 22px 14px;background:rgba(5,5,5,.92);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.clock{font-size:26px;font-weight:300;letter-spacing:.04em;font-variant-numeric:tabular-nums}
.wex{margin:14px 22px 0;padding:16px;border-radius:22px;border:1px solid var(--line);background:var(--card)}
.wex .hd{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.wex .hd .th{width:52px;height:52px;border-radius:14px;overflow:hidden;background:#e8e4da;flex:none}
.wex .hd img{width:100%;height:100%;object-fit:cover}
.srow{display:grid;grid-template-columns:30px 1fr 1fr 44px;gap:8px;align-items:center;margin-bottom:8px}
.srow.h{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--mu)}
.srow input{width:100%;height:44px;border-radius:12px;background:var(--card2);border:1px solid var(--line);text-align:center;outline:none;font-size:15px}
.srow input:focus{border-color:var(--gold)}
.srow .ok{height:44px;border-radius:12px;border:1px solid var(--line2);display:flex;align-items:center;justify-content:center}
.srow .ok svg{width:18px;height:18px;opacity:.35}
.srow.done input{background:rgba(201,169,107,.14);border-color:rgba(201,169,107,.4)}
.srow.done .ok{background:var(--gold);border-color:var(--gold);color:#0a0a0a}
.srow.done .ok svg{opacity:1}
.rest{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:60;background:var(--bone);color:#0a0a0a;border-radius:99px;padding:14px 22px;display:flex;align-items:center;gap:16px;font-weight:600;box-shadow:0 12px 40px rgba(0,0,0,.6);animation:up .35s var(--out)}
.rest b{font-size:20px;font-variant-numeric:tabular-nums;font-weight:600}
.rest button{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--mu);min-height:44px;padding:0 6px}
.minicard{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-radius:18px;border:1px solid var(--line);background:var(--card);margin-bottom:10px}
/* ---- v3: movimiento, foco y sección Moon ---- */
:focus-visible{outline:2px solid var(--gold2);outline-offset:3px;border-radius:12px}
input:focus-visible{outline:0}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.55;
  background:radial-gradient(1.2px 1.2px at 12% 18%,#f2ede4 50%,transparent 51%),radial-gradient(1px 1px at 82% 12%,#e6cc94 50%,transparent 51%),radial-gradient(1.4px 1.4px at 66% 38%,#f2ede4 50%,transparent 51%),radial-gradient(1px 1px at 28% 56%,#e6cc94 50%,transparent 51%),radial-gradient(1.2px 1.2px at 90% 72%,#f2ede4 50%,transparent 51%),radial-gradient(1px 1px at 8% 86%,#f2ede4 50%,transparent 51%),radial-gradient(1.3px 1.3px at 50% 92%,#e6cc94 50%,transparent 51%);animation:tw 6s ease-in-out infinite;will-change:opacity}
@media (max-width:480px){body::before{animation:none}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
#view.enter>section>*:not(img.bg),#view.enter>.chips,#view.enter>.search,#view.enter>.exrow{animation:rise .45s var(--out) both;animation-delay:calc(var(--s,0)*.1s + var(--i,0)*.05s)}
#view>section:nth-of-type(2){--s:1}#view>section:nth-of-type(3){--s:2}#view>section:nth-of-type(4){--s:3}#view>section:nth-of-type(n+5){--s:4}
#view>section>*:nth-child(2){--i:1}#view>section>*:nth-child(3){--i:2}#view>section>*:nth-child(4){--i:3}#view>section>*:nth-child(5){--i:4}#view>section>*:nth-child(n+6){--i:5}
@keyframes grow{from{transform:scaleX(0)}}
.bar>i{transform-origin:left;animation:grow 1.1s var(--out) .25s backwards}
.btn.gold{position:relative;overflow:hidden}
.btn.gold::after{content:"";position:absolute;top:0;bottom:0;left:0;width:40%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.45),transparent);transform:translateX(-150%) skewX(-20deg);animation:sheen 5s ease-in-out 1.2s infinite}
@keyframes sheen{0%,70%{transform:translateX(-150%) skewX(-20deg)}100%{transform:translateX(350%) skewX(-20deg)}}
.rwd,.exrow,.minicard,.routine,.mission{transition:transform .2s var(--out),border-color .25s,background .25s}
.rwd:active,.exrow:active,.minicard:active,.mission:active{transform:scale(.985)}
@media (hover:hover){.rwd:hover,.exrow:hover,.routine:hover,.mission:hover{border-color:var(--line2);background:var(--card2)}.chip:hover,.pill:hover{border-color:var(--gold)}}
.nav{padding:8px 8px calc(8px + env(safe-area-inset-bottom))}
.nav>div{gap:2px;padding:4px}
.nav button{min-width:0;padding:0 1px;overflow:hidden;font-size:10px;letter-spacing:.02em;text-transform:none}
.nav button span{max-width:100%;white-space:nowrap}
.nav button svg{transition:transform .35s var(--out)}
.nav button.on svg{transform:translateY(-1px) scale(1.08)}
.live{display:inline-flex;align-items:center;gap:8px;padding:6px 13px;border-radius:99px;border:1px solid rgba(157,191,166,.35);color:var(--ok);font-size:11.5px;letter-spacing:.08em;font-weight:500}
.live::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 0 0 currentColor;animation:ping 2s infinite}
.live.off{border-color:var(--line2);color:var(--mu)}
@keyframes ping{70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}
.hrow{display:flex;justify-content:space-between;align-items:center;padding:16px 4px;border-bottom:1px solid var(--line);font-size:14.5px}
.hrow:last-child{border:0}
.hrow b{font-weight:600}.hrow span{color:var(--bone2);font-variant-numeric:tabular-nums}
.hrow.today{color:var(--gold2)}.hrow.today span{color:var(--gold2)}
.pcard{position:relative;padding:20px;border-radius:22px;border:1px solid var(--line);background:var(--card);margin-bottom:12px}
.pcard.me h3{padding-right:90px}
.live{background:rgba(5,5,5,.6)}
.pcard.me{border-color:var(--gold);box-shadow:0 0 0 1px rgba(201,169,107,.25),0 12px 40px rgba(201,169,107,.08)}
.pcard h3{font-family:var(--serif);font-style:italic;font-weight:500;font-size:26px}
.pcard .pr{font-size:30px;font-weight:300;margin-top:4px}.pcard .pr small{font-size:12px;color:var(--mu);letter-spacing:.06em}
.pcard .badge{position:absolute;top:18px;right:18px}
.cmp{width:100%;border-collapse:collapse;font-size:11px;table-layout:fixed}
.cmp th,.cmp td{padding:10px 3px;text-align:center;border-bottom:1px solid var(--line);overflow-wrap:anywhere}
.cmp th{font-size:9.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--mu);font-weight:500}
.cmp th:first-child{width:34%}
.cmp th:first-child,.cmp td:first-child{text-align:left;padding-left:0;color:var(--bone2)}
.cmp td svg{width:16px;height:16px;color:var(--gold2)}
.cmp td.no{color:var(--mu)}
.notice{display:flex;gap:14px;padding:16px;border-radius:20px;border:1px solid rgba(201,169,107,.35);background:rgba(201,169,107,.07)}
.notice svg{width:22px;height:22px;flex:none;color:var(--gold2);margin-top:2px}
.notice p{font-size:13px;color:var(--bone2)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.phasehero .phases{animation:float 5.5s ease-in-out infinite}
.phasehero::before{content:"";position:absolute;left:50%;top:58%;width:78%;height:46%;transform:translate(-50%,-50%);background:radial-gradient(closest-side,rgba(230,204,148,.28),transparent);filter:blur(10px);animation:halo 4s ease-in-out infinite;pointer-events:none}
.phasehero{position:relative}
.track{padding:16px 18px;border-radius:22px;border:1px solid var(--line);background:var(--card);cursor:pointer;transition:transform .2s var(--out),border-color .25s}
.track:active{transform:scale(.985)}
.trk{display:flex;align-items:center;gap:12px}.trk .bar{flex:1;height:12px}
.chest{flex:none;width:44px;height:44px;border-radius:14px;border:1px solid var(--line2);background:var(--card2);display:flex;align-items:center;justify-content:center;color:var(--gold2)}
.chest svg{width:22px;height:22px}.chest.ready{background:linear-gradient(135deg,#e9d3a0,#c9a96b);color:#0a0a0a;border-color:transparent;animation:bump 1.6s var(--out) infinite}
.btn.big{height:64px;font-size:16px;letter-spacing:.08em}
.btn.pulse{animation:glowp 2.4s ease-in-out infinite}
@keyframes glowp{0%,100%{box-shadow:0 8px 30px rgba(201,169,107,.25)}50%{box-shadow:0 8px 44px rgba(230,204,148,.55)}}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tile{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;border-radius:18px;border:1px solid var(--line);background:var(--card);text-align:center;transition:transform .2s var(--out)}
.tile:active{transform:scale(.96)}.tile span{width:36px;height:36px;border-radius:12px;background:var(--card2);display:flex;align-items:center;justify-content:center;color:var(--gold2)}
.tile span svg{width:20px;height:20px}.tile b{font-size:10.5px;font-weight:500;line-height:1.2;color:var(--bone2)}.tile small{font-size:11px;color:var(--gold2);font-weight:600}
.tile.open{border-color:rgba(201,169,107,.5)}
.scene{position:relative;padding-bottom:6px;background:radial-gradient(120% 60% at 50% 38%,rgba(230,204,148,.14),transparent 70%)}
.scene .sparks{inset:0}
.stages{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.stg{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 2px;border-radius:16px;border:1px solid var(--line);background:var(--card);text-align:center;opacity:.5}
.stg.on{opacity:1;border-color:rgba(201,169,107,.45)}
.stg b{font-size:9.5px;font-weight:500;line-height:1.2}.stg small{font-size:9px;color:var(--mu)}
.phases.mini i{width:7px;height:7px}
.phasehero{display:flex;justify-content:center;padding:30px 0 16px;width:auto;margin:0}
.phasehero .phases{gap:clamp(8px,3vw,14px)}
.phasehero .phases i{width:clamp(34px,11.5vw,54px);height:auto;aspect-ratio:1;transition:opacity .6s var(--out)}
.phasehero .phases i:not([style*=".28"]){filter:drop-shadow(0 0 14px rgba(230,204,148,.35))}
.phasehero.happy .phases i:not([style*=".28"]){filter:drop-shadow(0 0 22px rgba(230,204,148,.8))}

<body>
<div id="root"></div>
<script>
/* ============ Moon Club — PWA demo (datos en este dispositivo) ============ */
const $=(s,r=document)=>r.querySelector(s);
const KEY='moonclub.v3';
const STAGES=[
 {n:'Luna nueva',min:0,say:'Tu primera visita enciende la primera fase.'},
 {n:'Creciente',min:6,say:'Ya llevas tus primeras visitas. Sigue así.'},
 {n:'Cuarto',min:20,say:'Mitad luz, mitad constancia.'},
 {n:'Gibosa',min:45,say:'Casi completa. Se nota tu disciplina.'},
 {n:'Luna llena',min:90,say:'Ciclo completo. Constancia total.'}
];
const PLANS=[{id:'mensual',n:'Mensual',p:'$850 / mes',big:'$850',per:'al mes',eq:''},{id:'estandar',n:'Anual Estándar',p:'$9,500',big:'$9,500',per:'al año',eq:'$792 al mes'},{id:'plus',n:'Anual Plus',p:'$10,000',big:'$10,000',per:'al año',eq:'$833 al mes'}];
const HORARIO=[{d:'Lun – Vie',days:[1,2,3,4,5],o:300,c:1380},{d:'Sábado',days:[6],o:480,c:1020},{d:'Domingo',days:[0],o:540,c:840}];
const hm=m=>{const h=Math.floor(m/60),x=m%60,ap=h>=12?'pm':'am';return `${String(h%12||12).padStart(2,'0')}:${String(x).padStart(2,'0')} ${ap}`};
function openNow(d=new Date()){const mi=d.getHours()*60+d.getMinutes();const t=HORARIO.find(h=>h.days.includes(d.getDay()));
 if(t&&mi>=t.o&&mi<t.c)return {on:true,txt:`Abierto · cierra ${hm(t.c)}`};
 if(t&&mi<t.o)return {on:false,txt:`Cerrado · abre hoy ${hm(t.o)}`};
 const n=new Date(d);n.setDate(n.getDate()+1);const nt=HORARIO.find(h=>h.days.includes(n.getDay()));return {on:false,txt:`Cerrado · abre mañana ${hm(nt.o)}`}}
const ICONS={
 spark:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 1.5c.7 5.4 3.6 8.3 9 9-5.4.7-8.3 3.6-9 9-.7-5.4-3.6-8.3-9-9 5.4-.7 8.3-3.6 9-9z"/></svg>',
 home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 0 0 16"/></svg>',
 gift:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="9" width="17" height="11" rx="2"/><path d="M12 9v11M3.5 13h17M12 9c-1-4-5-4.5-5-2s3 2 5 2zm0 0c1-4 5-4.5 5-2s-3 2-5 2z"/></svg>',
 flame:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c1 3.5 5 5.5 5 10a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 2.5 1.5 2.5C10 9 11 6 12 3z"/></svg>',
 user:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8.5" r="3.6"/><path d="M4.5 20c.8-4 3.7-6 7.5-6s6.7 2 7.5 6"/></svg>',
 check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
 cup:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h10l-1 15a3 3 0 0 1-3 2.8h-2A3 3 0 0 1 8 18L7 3zM7.4 8h9.2"/></svg>',
 people:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8.5" r="3.2"/><path d="M3 19c.6-3.3 3-5 6-5s5.4 1.7 6 5M16 5.5a3 3 0 0 1 0 6M18 14.3c1.6.6 2.7 2 3 4.7"/></svg>',
 bottle:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2.5h4v3l1.5 2.5v12a1.8 1.8 0 0 1-1.8 1.8h-3.4A1.8 1.8 0 0 1 8.5 20V8L10 5.5v-3zM8.5 12h7"/></svg>',
 shirt:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 3.5L3 6.5l2 4 2.5-1V20.5h9V9.5l2.5 1 2-4-5.5-3c-.6 1.6-1.8 2.4-3.5 2.4S9.1 5.1 8.5 3.5z"/></svg>',
 tag:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 12.5V4.5a1 1 0 0 1 1-1h8l8 8a1 1 0 0 1 0 1.4l-7.1 7.1a1 1 0 0 1-1.4 0l-8.5-7.5zM8 8h.01"/></svg>',
 reformer:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 15h18M5 15v3M19 15v3M7 15l3-6h7M15 9l-2.5 6"/></svg>',
 dumb:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></svg>',
 book:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H11v16H5.5A1.5 1.5 0 0 1 4 18.5v-13zM20 5.5A1.5 1.5 0 0 0 18.5 4H13v16h5.5a1.5 1.5 0 0 0 1.5-1.5v-13z"/></svg>',
 clock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>',
 bell:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 17h12l-1.5-2.2V10a4.5 4.5 0 0 0-9 0v4.8L6 17zM10 19.5a2 2 0 0 0 4 0"/></svg>',
 plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>'
};
const icon=n=>ICONS[n]||ICONS.gift;
const phaseRow=(on=5,vol=false)=>{const f=vol?'url(#pg)':'#f2ede4',d=vol?.22:.28;
 const s=(a,b)=>`<svg viewBox="0 0 12 12" style="width:100%;height:100%">${a}</svg>`;
 const items=[
  '<path d="M6 1.2A4.8 4.8 0 0 1 6 10.8A2.6 4.8 0 0 0 6 1.2z" fill="'+f+'"/>',
  '<path d="M6 1.2a4.8 4.8 0 0 1 0 9.6z" fill="'+f+'"/>',
  '<circle cx="6" cy="6" r="4.8" fill="'+f+'"/>',
  '<path d="M6 1.2a4.8 4.8 0 0 0 0 9.6z" fill="'+f+'"/>',
  '<path d="M6 1.2A4.8 4.8 0 0 0 6 10.8A2.6 4.8 0 0 1 6 1.2z" fill="'+f+'"/>'];
 return `<span class="phases">${items.map((x,i)=>`<i style="opacity:${i<on?1:d}">${s(x)}</i>`).join('')}</span>`};

/* ---------- estado ---------- */
const todayStr=(d=new Date())=>{const z=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}`};
const fromStr=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const weekStart=d=>{const x=new Date(d);const wd=(x.getDay()+6)%7;x.setDate(x.getDate()-wd);x.setHours(0,0,0,0);return x};
const wkey=d=>todayStr(weekStart(d));
function seed(){
  const members=[];
  return {v:3,members,me:null,
    rewards:[
     {id:'r1',name:'Acceso a un evento o activación Moon',desc:'Lugar en una activación o evento de la comunidad Moon.',cost:250,icon:'spark',active:true},
     {id:'r2',name:'Beneficio con un aliado Moon',desc:'Un beneficio con uno de los aliados seleccionados de Moon.',cost:300,icon:'tag',active:true},
     {id:'r3',name:'Merch Moon',desc:'Un artículo del merch oficial del club.',cost:800,icon:'shirt',active:true}],
    redemptions:[],
    settings:{pin:'2026',perVisit:10,weeklyGoal:3,weeklyBonus:20,streakBonus:{4:50,8:120,12:200},salt:Math.random().toString(36).slice(2,8)}};
}
function rebuildLedger(visits,per,goal){
  const l=[];const byWeek={};
  [...visits].sort().forEach(v=>{l.push({ts:v,amt:per,why:'Visita al club'});
    const k=wkey(fromStr(v));byWeek[k]=(byWeek[k]||0)+1;
    if(byWeek[k]===goal)l.push({ts:v,amt:20,why:'Semana completa'});});
  return l;
}
let S=load();
function load(){try{const r=JSON.parse(localStorage.getItem(KEY));if(r&&r.v===3)return r}catch(e){}const s=seed();localStorage.setItem(KEY,JSON.stringify(s));return s}
const save=()=>localStorage.setItem(KEY,JSON.stringify(S));
const me=()=>S.members.find(m=>m.id===S.me);
const bal=m=>m.ledger.reduce((a,b)=>a+b.amt,0);
const stageOf=m=>{let s=0;STAGES.forEach((x,i)=>{if(m.visits.length>=x.min)s=i});return s};
const dailyCode=(d=todayStr())=>{let h=7;const s=d+S.settings.salt;for(const c of s)h=(h*31+c.charCodeAt(0))>>>0;return String(1000+(h%9000))};
const weekVisits=(m,d=new Date())=>m.visits.filter(v=>wkey(fromStr(v))===wkey(d));
function streakWeeks(m){ // semanas consecutivas con meta cumplida (la actual cuenta si ya se cumplió; si no, no rompe)
  const goal=S.settings.weeklyGoal;const cnt={};m.visits.forEach(v=>{const k=wkey(fromStr(v));cnt[k]=(cnt[k]||0)+1});
  let d=weekStart(new Date());let n=0;
  if((cnt[wkey(d)]||0)>=goal)n++;
  d.setDate(d.getDate()-7);
  while((cnt[wkey(d)]||0)>=goal){n++;d.setDate(d.getDate()-7)}
  return n;
}
function checkIn(m,code){
  const t=todayStr();
  if(code!==dailyCode())return {ok:false,msg:'Código incorrecto. Pídelo en recepción.'};
  if(m.visits.includes(t))return {ok:false,msg:'Ya registraste tu visita de hoy.'};
  m.visits.push(t);m.visits.sort();
  const st=S.settings;let gain=st.perVisit;m.ledger.push({ts:t,amt:st.perVisit,why:'Visita al club'});
  const extra=[];
  if(weekVisits(m).length===st.weeklyGoal){m.ledger.push({ts:t,amt:st.weeklyBonus,why:'Semana completa'});gain+=st.weeklyBonus;extra.push('Semana completa');
    const sw=streakWeeks(m);const b=st.streakBonus[sw];
    if(b){m.ledger.push({ts:t,amt:b,why:`Racha de ${sw} semanas`});gain+=b;extra.push(`Racha de ${sw} semanas`)}}
  save();return {ok:true,gain,extra};
}
function redeem(m,r){
  if(bal(m)<r.cost)return null;
  const code='MN-'+Math.random().toString(36).slice(2,6).toUpperCase();
  m.ledger.push({ts:todayStr(),amt:-r.cost,why:'Canje: '+r.name});
  const red={id:'x'+Date.now(),mid:m.id,rid:r.id,name:r.name,cost:r.cost,code,ts:new Date().toISOString(),status:'pendiente'};
  S.redemptions.unshift(red);save();return red;
}

/* ---------- Luna (mascota) ---------- */
function luna(stage,{happy=false}={}){
  return `<div class="luna phasehero${happy?' happy':''}" role="img" aria-label="Fase ${stage+1} de 5"><svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><radialGradient id="pg" cx="35%" cy="28%" r="85%"><stop offset="0" stop-color="#fffaf0"/><stop offset=".55" stop-color="#e9dfc9"/><stop offset="1" stop-color="#b9a47a"/></radialGradient></defs></svg>${phaseRow(stage+1,true)}</div>`;
}

/* ---------- helpers UI ---------- */
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const root=$('#root');
let tab='home',atab='hoy',adminOK=false,toastT;

function sheet(html,onMount){const bg=document.createElement('div');bg.className='sheet-bg';bg.innerHTML=`<div class="sheet">${html}</div>`;bg.addEventListener('click',e=>{if(e.target===bg)close()});document.body.appendChild(bg);const close=()=>{bg.remove();bg.dispatchEvent(new Event('closed'))};bg.close=close;onMount&&onMount(bg,close);return bg}
const nf=n=>n.toLocaleString('es-MX');
const fmtD=s=>fromStr(s.slice(0,10)).toLocaleDateString('es-MX',{day:'numeric',month:'short'});

/* ---------- pantallas socio ---------- */
function render(){
  if(location.hash.startsWith('#/admin')){return renderAdmin()}
  document.body.classList.remove('admin');
  if(!me())return renderWelcome();
  const m=me();
  const views={home:viewHome,train:viewTrain,lib:viewLib,luna:viewLuna,moon:viewMoon,premios:viewPremios,yo:viewYo};
  if(!views[tab])tab='home';
  root.innerHTML=`<div class="app">
   <header class="top"><img class="logo" src="img/logo-full.png" alt="Moon Wellness Club"><div class="coins">${ICONS.spark}<span id="bal">${nf(bal(m))}</span></div></header>
   <main id="view"></main></div>
   <nav class="nav"><div>${[['home','Inicio','home'],['train','Entrenar','dumb'],['luna','Luna','spark'],['moon','Moon','clock'],['premios','Premios','gift'],['yo','Perfil','user']].map(([k,l,i])=>`<button data-t="${k}" class="${(tab===k||(tab==='lib'&&k==='train'))?'on':''}" ${tab===k?'aria-current="page"':''}>${ICONS[i]}<span>${l}</span></button>`).join('')}</div></nav>`;
  root.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;render();window.scrollTo(0,0)});
  const vw=$('#view');vw.classList.toggle('enter',window.__lt!==tab);window.__lt=tab;clearTimeout(window.__et);window.__et=setTimeout(()=>vw.classList.remove('enter'),900);
  views[tab](m,vw);
}
function nextReward(m){const b=bal(m);const act=S.rewards.filter(r=>r.active).sort((a,c)=>a.cost-c.cost);return act.find(r=>r.cost>b)||act[act.length-1]}
function viewHome(m,v){
  const st=stageOf(m);const t=todayStr();const done=m.visits.includes(t);
  const wk=weekVisits(m).length;const goal=S.settings.weeklyGoal;
  const nxt=nextReward(m);const b=bal(m);
  const toNext=STAGES[st+1]?STAGES[st+1].min-m.visits.length:0;
  const days=['L','M','M','J','V','S','D'];
  const ws=weekStart(new Date());
  const wkDays=days.map((d,i)=>{const x=new Date(ws);x.setDate(x.getDate()+i);return {d,on:m.visits.includes(todayStr(x)),today:todayStr(x)===t}});
  v.innerHTML=`<section class="hero photo" id="hero" style="margin-top:-62px;padding-top:70px"><img class="bg" src="img/gym-1.jpg" alt="">
    <div class="eyebrow">Fase ${st+1} de 5</div>

function openCheckin(m){
  let stream=null,stop=false;
  const bg=sheet(`<h2>Registrar visita</h2><p class="mu" style="font-size:13.5px">Escanea el QR de recepción o escribe el código de 4 dígitos.</p>
   <div id="camwrap" style="margin-top:18px" hidden><video id="cam" playsinline muted></video></div>
   <div class="codebox"><input id="code" inputmode="numeric" maxlength="4" placeholder="••••" autocomplete="off"></div>
   <div class="err" id="err"></div>
   <div class="row" style="gap:10px;margin-top:6px"><button class="btn ghost" id="scan" style="flex:1">Escanear QR</button><button class="btn gold" id="ok" style="flex:1">Confirmar</button></div>`,(bg,close)=>{
    let bad='';
    const done=code=>{if(code===bad)return;const r=checkIn(m,code);
      if(!r.ok){bad=code;$('#err',bg).textContent=r.msg;return}
      stop=true;if(stream)stream.getTracks().forEach(t=>t.stop());close();celebrate(r)};
    $('#ok',bg).onclick=()=>done($('#code',bg).value.trim());
    $('#code',bg).addEventListener('keydown',e=>{if(e.key==='Enter')done(e.target.value.trim())});
    $('#scan',bg).onclick=async()=>{
      if(!('BarcodeDetector' in window)){$('#err',bg).textContent='Tu navegador no escanea QR. Escribe el código de 4 dígitos.';return}
      try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});const vid=$('#cam',bg);vid.srcObject=stream;await vid.play();$('#camwrap',bg).hidden=false;
        const det=new BarcodeDetector({formats:['qr_code']});
        const loop=async()=>{if(stop)return;try{const r=await det.detect(vid);const x=r.find(q=>/^MOON:\d{4}$/.test(q.rawValue));if(x){done(x.rawValue.slice(5));return}}catch(e){}requestAnimationFrame(loop)};loop();
      }catch(e){$('#err',bg).textContent='No pude abrir la cámara. Escribe el código.'}};
    bg.addEventListener('closed',()=>{stop=true;if(stream)stream.getTracks().forEach(t=>t.stop())});
    setTimeout(()=>$('#code',bg).focus(),300);
  });
}
function celebrate(r){
  const m=me();tab='home';render();
  const w=$('#lunawrap');if(!w)return;
  w.innerHTML=luna(stageOf(m),{happy:true})+`<div class="plus">+${r.gain}</div><div class="sparks">${Array.from({length:16},(_,i)=>{const a=i/16*Math.PI*2,d=90+Math.random()*80;return `<i style="--x:${Math.cos(a)*d}px;--y:${Math.sin(a)*d-20}px;animation-delay:${Math.random()*.15}s"></i>`}).join('')}</div>`;
  w.firstElementChild.classList.add('bump');
  setTimeout(()=>{const s=$('#lunawrap');if(s)s.innerHTML=luna(stageOf(m))},2400);
  toast(r.extra.length?r.extra.join(' · '):'Visita registrada');
  if(navigator.vibrate)navigator.vibrate(30);
}

function startWork(m,r){
  S.active=S.active||{};
  if(S.active[m.id]&&!confirm('Ya tienes un entrenamiento en curso. ¿Empezar uno nuevo?'))return showWork(m);
  S.active[m.id]={rid:r.id,name:r.name,start:Date.now(),items:r.items.map(id=>{const l=lastSet(m,id);return {ex:id,sets:[0,1,2].map(()=>({kg:l?l.kg:'',reps:l?l.reps:'',done:false}))}})};
  save();showWork(m);
}
let wTick=null,restT=null,restLeft=0;
function showWork(m){
  const W=S.active&&S.active[m.id];if(!W)return;
  document.querySelectorAll('.work').forEach(x=>x.remove());
  const el=document.createElement('div');el.className='work';document.body.appendChild(el);document.body.style.overflow='hidden';
  const draw=()=>{

   el.innerHTML=`<div class="bar2"><button class="pill" id="wc">Minimizar</button><div style="text-align:center"><div class="clock" id="clk">${fmtDur(Math.floor((Date.now()-W.start)/1000))}</div><div class="mu" style="font-size:11px;letter-spacing:.14em">${done} DE ${tot} SERIES</div></div><button class="btn sm gold" id="wf">Terminar</button></div>
   <div class="sec" style="padding-top:18px"><h1 class="serif" style="font-size:30px">${esc(W.name)}</h1></div>
   ${W.items.map((it,ii)=>{const e=EXM[it.ex];const b=bestKg(m,it.ex);return `<div class="wex"><div class="hd"><span class="th">${thumb(it.ex)}</span><div style="flex:1"><h3 style="font-size:15px;font-weight:600">${e.n}</h3><p class="mu" style="font-size:12px">${e.e}${b?` · Récord ${b} kg`:''}</p></div><button class="pill" data-info="${it.ex}">Ver</button></div>
     <div class="srow h"><span>#</span><span style="text-align:center">Kg</span><span style="text-align:center">Reps</span><span></span></div>
     ${it.sets.map((s,si)=>`<div class="srow ${s.done?'done':''}"><span class="mu" style="text-align:center">${si+1}</span><input inputmode="decimal" placeholder="0" value="${s.kg}" data-k="${ii}.${si}"><input inputmode="numeric" placeholder="0" value="${s.reps}" data-r="${ii}.${si}"><button class="ok" data-d="${ii}.${si}">${ICONS.check}</button></div>`).join('')}
     <div class="row" style="gap:8px;margin-top:6px"><button class="pill" data-as="${ii}">+ Serie</button><button class="pill" data-rx="${ii}">Quitar ejercicio</button></div></div>`}).join('')}
   <div class="sec" style="margin-top:18px"><button class="btn ghost" style="width:100%" id="wa">${ICONS.plus}Agregar ejercicio</button></div>`;
   const pos=s=>s.split('.').map(Number);
   el.querySelectorAll('[data-k]').forEach(i=>i.oninput=()=>{const[a,b]=pos(i.dataset.k);W.items[a].sets[b].kg=i.value;save()});
   el.querySelectorAll('[data-r]').forEach(i=>i.oninput=()=>{const[a,b]=pos(i.dataset.r);W.items[a].sets[b].reps=i.value;save()});
   el.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{const[a,c]=pos(b.dataset.d);const s=W.items[a].sets[c];s.done=!s.done;save();draw();if(s.done)startRest(90)});
   el.querySelectorAll('[data-as]').forEach(b=>b.onclick=()=>{const it=W.items[+b.dataset.as];const l=it.sets[it.sets.length-1]||{};it.sets.push({kg:l.kg||'',reps:l.reps||'',done:false});save();draw()});
   el.querySelectorAll('[data-rx]').forEach(b=>b.onclick=()=>{W.items.splice(+b.dataset.rx,1);save();draw()});
   el.querySelectorAll('[data-info]').forEach(b=>b.onclick=()=>exDetail(m,b.dataset.info,true));
   $('#wa',el).onclick=()=>pickExercises(id=>{const l=lastSet(m,id);W.items.push({ex:id,sets:[0,1,2].map(()=>({kg:l?l.kg:'',reps:l?l.reps:'',done:false}))});save()},()=>draw());
   $('#wc',el).onclick=()=>{closeWork();render()};
   $('#wf',el).onclick=()=>finishWork(m,W,el);
  };
  draw();

}

  const t=()=>{r.innerHTML=`<span>Descanso</span><b>${fmtDur(restLeft)}</b><button id="rs1">+15 s</button><button id="rs2">Saltar</button>`;$('#rs1',r).onclick=()=>{restLeft+=15;t()};$('#rs2',r).onclick=stopRest};t();
  restT=setInterval(()=>{restLeft--;if(restLeft<=0){stopRest();if(navigator.vibrate)navigator.vibrate([200,100,200]);toast('Descanso terminado');return}const b=$('#rest b');if(b)b.textContent=fmtDur(restLeft)},1000)}

function finishWork(m,W,el){
  const sets=[];W.items.forEach(it=>it.sets.forEach(s=>{const kg=parseFloat(String(s.kg).replace(',','.'))||0,reps=parseInt(s.reps)||0;if(s.done&&reps>0)sets.push({ex:it.ex,kg,reps})}));
  if(!sets.length){if(confirm('No marcaste ninguna serie. ¿Descartar el entrenamiento?')){delete S.active[m.id];save();closeWork();render()}return}
  const prs=[];sets.forEach(s=>{const b=bestKg(m,s.ex);const inNew=Math.max(...sets.filter(x=>x.ex===s.ex).map(x=>x.kg));if(inNew>b&&b>0&&!prs.includes(s.ex))prs.push(s.ex)});
  const vol=sets.reduce((a,s)=>a+s.kg*s.reps,0);const dur=Math.floor((Date.now()-W.start)/1000);
  LG(m).push({id:'w'+Date.now(),rid:W.rid,name:W.name,ts:todayStr(),dur,sets,vol});
  let gain=0;const t=todayStr();
  if(!m.ledger.some(l=>l.ts===t&&l.why==='Rutina completada')){m.ledger.push({ts:t,amt:5,why:'Rutina completada'});gain=5}
  delete S.active[m.id];save();closeWork();render();
  sheet(`<div style="text-align:center"><div class="eyebrow gold">Entrenamiento terminado</div><h2 style="margin-top:8px">${esc(W.name)}</h2>
   <div class="grid2" style="margin:20px 0"><div class="card stat"><b>${Math.max(1,Math.round(dur/60))}</b><span>minutos</span></div><div class="card stat"><b>${nf(Math.round(vol))}</b><span>kg movidos</span></div><div class="card stat"><b>${sets.length}</b><span>series</span></div><div class="card stat"><b>${prs.length}</b><span>récords nuevos</span></div></div>
   ${prs.length?`<p class="gold" style="font-size:13.5px;margin-bottom:12px">Récord en: ${prs.map(i=>EXM[i].n).join(', ')}</p>`:''}

}

   <div class="card"><div class="row sp"><span class="eyebrow">Membresía</span><span class="pill ok">Activa</span></div><h3 style="margin-top:12px;font-weight:500;font-size:20px">${plan.n}</h3><p class="mu">${plan.p}</p></div>
   <div class="space"></div>
   <div class="card"><div class="row sp"><span class="eyebrow">Teléfono</span><span>${esc(m.phone)}</span></div></div>
   <div class="space2"></div>
   <button class="btn ghost" style="width:100%" id="out">Cerrar sesión</button>
   <p class="mu" style="text-align:center;font-size:12px;margin-top:22px"><a href="#/admin" style="color:var(--mu)">Entrada del club</a></p>
  </section><div id="rk"></div>`;
  viewRacha(m,$('#rk'));
  $('#out').onclick=()=>{S.me=null;save();render()};
}
function renderWelcome(){
  document.body.classList.remove('admin');
  root.innerHTML=`<div class="app photo"><img class="bg" src="img/gym-1.jpg" alt="" style="opacity:.4"><div class="welcome">
   <img class="logo big" src="img/logo-full.png" alt="Moon Wellness Club">
   <div style="margin:6px 0 0">${luna(0)}</div>
   <div class="big">Cada visita<br>suma a tu ciclo.</div>
   <p class="mu" style="font-size:14px;max-width:300px;margin:0 auto 26px">Entrena, junta destellos y cámbialos por premios en Moon Wellness Club.</p>
   <button class="btn gold" id="new">Crear mi cuenta</button><div class="space"></div>
   <button class="btn ghost" id="demo">Probar la app</button>
   <p class="mu" style="font-size:12px;margin-top:22px"><a href="#/admin" style="color:var(--mu)">Entrada del club</a></p>
  </div></div>`;
  $('#demo').onclick=()=>{let d=S.members.find(x=>x.id==='demo');if(!d){d={id:'demo',name:'Cuenta de prueba',phone:'0000000000',plan:'mensual',since:todayStr(),visits:[],ledger:[{ts:todayStr(),amt:20,why:'Bienvenida'}],redeemed:0};S.members.push(d)}S.me=d.id;save();render()};
  $('#new').onclick=()=>sheet(`<h2>Bienvenido a Moon</h2><p class="mu" style="font-size:13.5px;margin-bottom:20px">Para que recepción te reconozca.</p>
   <label class="field"><span>Nombre</span><input id="n" autocomplete="name"></label>
   <label class="field"><span>Teléfono</span><input id="p" inputmode="tel" autocomplete="tel"></label>
   <div class="field"><span>Mi membresía</span><div class="plans">${PLANS.map((p,i)=>`<label><input type="radio" name="pl" value="${p.id}" ${i===0?'checked':''}><b style="font-weight:500">${p.n}</b><small>${p.p}</small></label>`).join('')}</div></div>
   <div class="err" id="e"></div><button class="btn gold" style="width:100%" id="go">Empezar</button>`,(bg,close)=>{
    $('#go',bg).onclick=()=>{const n=$('#n',bg).value.trim(),p=$('#p',bg).value.trim();
      if(n.length<2||p.replace(/\D/g,'').length<10){$('#e',bg).textContent='Escribe tu nombre y un teléfono de 10 dígitos.';return}
      const m={id:'m'+Date.now(),name:n,phone:p,plan:bg.querySelector('input[name=pl]:checked').value,since:todayStr(),visits:[],ledger:[{ts:todayStr(),amt:20,why:'Bienvenida'}],redeemed:0};
      S.members.push(m);S.me=m.id;save();close();render()}});
}

/* ---------- panel del club ---------- */
function renderAdmin(){
  document.body.classList.add('admin');
  if(!adminOK){
    root.innerHTML=`<div class="app"><div class="welcome"><div>${phaseRow()}</div><div class="big" style="font-size:20px;letter-spacing:.5em;font-style:normal;font-family:var(--sans);margin:12px 0 4px;font-weight:500">MOON</div><p class="eyebrow">Panel del club</p><div class="space2"></div>
    <div class="codebox"><input id="pin" type="password" inputmode="numeric" maxlength="4" placeholder="••••"></div><div class="err" id="e"></div>
    <button class="btn" id="in">Entrar</button><p style="margin-top:14px"><a href="#/" style="color:var(--mu);font-size:12px">Volver a la app</a></p></div></div>`;
    const go=()=>{if($('#pin').value===S.settings.pin){adminOK=true;renderAdmin()}else $('#e').textContent='PIN incorrecto'};
    $('#in').onclick=go;$('#pin').addEventListener('keydown',e=>e.key==='Enter'&&go());return;
  }
  const T=[['hoy','Hoy'],['socios','Socios'],['canjes','Canjes'],['premios','Premios'],['ajustes','Ajustes']];
  const pend=S.redemptions.filter(r=>r.status==='pendiente').length;
  root.innerHTML=`<div class="app wide"><header class="top"><div class="brand">${phaseRow()}<b>MOON · CLUB</b></div><a href="#/" class="pill">Ver app del socio</a></header>
   <div class="atabs">${T.map(([k,l])=>`<button data-a="${k}" class="${atab===k?'on':''}">${l}${k==='canjes'&&pend?` · ${pend}`:''}</button>`).join('')}</div><div class="space"></div><main class="sec" id="av"></main></div>`;
  root.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{atab=b.dataset.a;renderAdmin()});
  ({hoy:aHoy,socios:aSocios,canjes:aCanjes,premios:aPremios,ajustes:aAjustes})[atab]($('#av'));
}
function aHoy(v){
  const t=todayStr();const hoy=S.members.filter(m=>m.visits.includes(t));
  const sem=S.members.reduce((a,m)=>a+weekVisits(m).length,0);
  const act=S.members.filter(m=>m.visits.some(x=>(new Date()-fromStr(x))/864e5<=14)).length;
  const emit=S.members.reduce((a,m)=>a+m.ledger.filter(l=>l.amt>0).reduce((s,l)=>s+l.amt,0),0);
  const code=dailyCode();
  v.innerHTML=`<div class="kpis"><div class="card stat"><b>${hoy.length}</b><span>visitas hoy</span></div><div class="card stat"><b>${sem}</b><span>visitas esta semana</span></div><div class="card stat"><b>${act}/${S.members.length}</b><span>activos (14 días)</span></div><div class="card stat"><b>${nf(emit)}</b><span>destellos emitidos</span></div></div>
  <div class="space"></div>
  <div class="grid2" style="grid-template-columns:repeat(auto-fit,minmax(280px,1fr))">
   <div class="card" style="text-align:center"><div class="eyebrow">Código de hoy</div><div class="big-code gold">${code}</div><p class="mu" style="font-size:12px">Cambia solo cada día a las 12 de la noche. Muéstralo en recepción como QR.</p><div class="qrwrap" id="qr"></div><button class="btn ghost sm" onclick="window.print()">Imprimir QR</button></div>
   <div class="card"><div class="eyebrow" style="margin-bottom:8px">Entraron hoy</div>${hoy.length?`<ul class="ledger">${hoy.map(m=>`<li><span>${esc(m.name)}</span><span class="mu">${streakWeeks(m)} sem. de racha</span></li>`).join('')}</ul>`:'<p class="mu" style="padding:14px 0">Aún nadie ha registrado su visita hoy.</p>'}</div></div>`;
  drawQR($('#qr'),'MOON:'+code);
}
function drawQR(el,text){
  const go=()=>{try{const q=qrcode(0,'M');q.addData(text);q.make();el.innerHTML=q.createSvgTag({cellSize:4,margin:0,scalable:true})}catch(e){el.innerHTML='<div style="color:#000;font-size:12px;padding:20px">QR no disponible sin internet. Usa el código.</div>'}};
  if(window.qrcode)return go();
  const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js';s.integrity='sha384-8FWZA6BGMXhsfO+BLtrJK0We6gg5o1JyO8xQm6peWDEUs17ACA5ziE/NIAkl9z2k';s.crossOrigin='anonymous';s.onload=go;s.onerror=go;document.head.appendChild(s);
}
function aSocios(v){
  if(!S.members.length){v.innerHTML='<h2 class="serif" style="font-size:30px;margin-bottom:14px">Socios</h2><p class="mu">Todavía no hay socios registrados. Aparecerán aquí cuando creen su cuenta en la app.</p>';return}
  const rows=S.members.map(m=>({m,last:m.visits[m.visits.length-1]||'—',sw:streakWeeks(m),b:bal(m)})).sort((a,b)=>String(b.last).localeCompare(String(a.last)));
  v.innerHTML=`<div class="row sp" style="margin-bottom:14px"><h2 class="serif" style="font-size:30px">${S.members.length} socios</h2></div>
  <div class="card scroll"><table><thead><tr><th>Socio</th><th>Plan</th><th>Visitas</th><th>Racha</th><th>Destellos</th><th>Última</th></tr></thead><tbody>
  ${rows.map(({m,last,sw,b})=>{const gone=last!=='—'&&(new Date()-fromStr(last))/864e5>14;return `<tr><td><b style="font-weight:500">${esc(m.name)}</b><div class="mu" style="font-size:11.5px">${esc(m.phone)}</div></td><td>${(PLANS.find(p=>p.id===m.plan)||PLANS[0]).n}</td><td>${m.visits.length}</td><td>${sw} sem.</td><td class="gold">${nf(b)}</td><td>${last==='—'?last:fmtD(last)} ${gone?'<span class="pill warn">Sin venir</span>':''}</td></tr>`}).join('')}
  </tbody></table></div><p class="mu" style="font-size:12px;margin-top:10px">Los socios que llevan más de 14 días sin venir salen marcados para que recepción les escriba.</p>`;
}
function aCanjes(v){
  const L=S.redemptions;
  v.innerHTML=`<h2 class="serif" style="font-size:30px;margin-bottom:14px">Canjes</h2>${L.length?`<div class="card scroll"><table><thead><tr><th>Código</th><th>Socio</th><th>Premio</th><th>Fecha</th><th></th></tr></thead><tbody>${L.map(r=>{const m=S.members.find(x=>x.id===r.mid);return `<tr><td><b>${r.code}</b></td><td>${esc(m?m.name:'—')}</td><td>${esc(r.name)}</td><td>${fmtD(r.ts)}</td><td>${r.status==='pendiente'?`<button class="btn sm gold" data-e="${r.id}">Marcar entregado</button>`:'<span class="pill ok">entregado</span>'}</td></tr>`}).join('')}</tbody></table></div>`:'<p class="mu">Todavía no hay canjes.</p>'}`;
  v.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>{S.redemptions.find(r=>r.id===b.dataset.e).status='entregado';save();renderAdmin();toast('Entregado')});
}
function aPremios(v){
  v.innerHTML=`<div class="row sp" style="margin-bottom:14px"><h2 class="serif" style="font-size:30px">Premios</h2><button class="btn sm gold" id="add">Agregar</button></div>
  <div class="card scroll"><table><thead><tr><th>Premio</th><th>Destellos</th><th>Activo</th></tr></thead><tbody>${S.rewards.map(r=>`<tr><td><b style="font-weight:500">${esc(r.name)}</b><div class="mu" style="font-size:11.5px">${esc(r.desc)}</div></td><td><input type="number" min="10" step="10" value="${r.cost}" data-c="${r.id}"></td><td><button class="pill ${r.active?'ok':''}" data-t="${r.id}">${r.active?'Activo':'Oculto'}</button></td></tr>`).join('')}</tbody></table></div>
  <p class="mu" style="font-size:12px;margin-top:10px">Referencia: un socio de 3 visitas por semana junta unos 50 destellos a la semana (10 por visita más 20 de bono).</p>`;
  v.querySelectorAll('[data-c]').forEach(i=>i.onchange=()=>{S.rewards.find(r=>r.id===i.dataset.c).cost=Math.max(10,+i.value||10);save();toast('Guardado')});
  v.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{const r=S.rewards.find(r=>r.id===b.dataset.t);r.active=!r.active;save();renderAdmin()});
  $('#add').onclick=()=>sheet(`<h2>Nuevo premio</h2><div class="space"></div><label class="field"><span>Nombre</span><input id="rn"></label><label class="field"><span>Descripción</span><input id="rd"></label><label class="field"><span>Destellos</span><input id="rc" type="number" value="300"></label><button class="btn gold" style="width:100%" id="rs">Guardar</button>`,(bg,close)=>{$('#rs',bg).onclick=()=>{const n=$('#rn',bg).value.trim();if(!n)return;S.rewards.push({id:'r'+Date.now(),name:n,desc:$('#rd',bg).value.trim(),cost:Math.max(10,+$('#rc',bg).value||300),icon:'gift',active:true});save();close();renderAdmin()}});
}
function aAjustes(v){
  const s=S.settings;
  v.innerHTML=`<h2 class="serif" style="font-size:30px;margin-bottom:14px">Ajustes</h2><div class="card">
   <label class="field"><span>Destellos por visita</span><input id="a1" type="number" value="${s.perVisit}"></label>
   <label class="field"><span>Meta de visitas por semana</span><input id="a2" type="number" min="1" max="7" value="${s.weeklyGoal}"></label>
   <label class="field"><span>Bono por semana completa</span><input id="a3" type="number" value="${s.weeklyBonus}"></label>
   <label class="field"><span>PIN del panel</span><input id="a4" maxlength="4" value="${s.pin}"></label>
   <button class="btn gold" id="sv">Guardar</button></div>
   <div class="space"></div><div class="card"><div class="eyebrow">Demo</div><p class="mu" style="font-size:13px;margin:8px 0 14px">Los datos de esta versión viven en este dispositivo. Para varios teléfonos a la vez se conecta una base de datos.</p><button class="btn ghost sm" id="rs">Borrar los datos de esta demo</button></div>`;
  $('#sv').onclick=()=>{s.perVisit=Math.max(1,+$('#a1').value||10);s.weeklyGoal=Math.min(7,Math.max(1,+$('#a2').value||3));s.weeklyBonus=Math.max(0,+$('#a3').value||0);const p=$('#a4').value.replace(/\D/g,'');if(p.length===4)s.pin=p;save();toast('Guardado')};
  $('#rs').onclick=()=>{if(confirm('Se borran todos los datos de esta demo. ¿Seguir?')){localStorage.removeItem(KEY);S=load();adminOK=false;location.hash='#/';render()}};
}
window.addEventListener('hashchange',render);
render();
if('serviceWorker' in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
